name: CI

# Typecheck + unit tests for the Next.js apps. Lint is deliberately not here yet:
# the tree has a large pre-existing eslint backlog; it joins CI once that is
# cleared so the badge means something.

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop-ui/**"
      - "packages/cli/**"
      - "apps/web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "patches/**"
      - ".nvmrc"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "apps/desktop-ui/**"
      - "packages/cli/**"
      - "apps/web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "patches/**"
      - ".nvmrc"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        # version intentionally omitted — taken from package.json "packageManager"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck desktop-ui
        run: pnpm --filter @mydevtools/desktop-ui exec tsc --noEmit

      - name: Typecheck web
        run: pnpm --filter @mydevtools/web exec tsc --noEmit

      - name: Unit tests (desktop-ui)
        run: pnpm --filter @mydevtools/desktop-ui exec jest --ci

      # The CLI runs desktop-ui's sources directly (packages/cli/register.mjs),
      # so it needs only desktop-ui's install.
      - name: Typecheck CLI
        run: node apps/desktop-ui/node_modules/typescript/bin/tsc -p packages/cli/tsconfig.json

      - name: Tests (CLI)
        working-directory: packages/cli
        run: node --import ./register.mjs --test "test/*.test.ts"

name: threatcrush security scan

on:
  pull_request:
  # A scan of main gives code scanning a baseline, so the Security tab can
  # tell a pull request's new alerts from ones main already had.
  push:
    branches: [main]

# A newer push to the same PR makes the running scan moot.
concurrency:
  group: threatcrush-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# pull-requests: write for the PR comment, security-events: write for the
# Security tab upload. Both are best-effort: fork PRs get a read-only token,
# and the report still lands in the job summary and the artifact.
permissions:
  contents: read
  pull-requests: write
  security-events: write

env:
  # Never send results to threatcrush.com. CI is not logged in, so nothing
  # would upload today; this keeps it that way if a key is ever configured.
  THREATCRUSH_UPLOAD: "0"
  # Severities that fail the job (comma list: critical,high,medium,low,info).
  # Empty = report only. False positives are suppressed inline with
  # `threatcrush-disable-next-line <rule-id>` plus a reason, never by widening
  # .threatcrushignore.
  FAIL_ON: ""

jobs:
  scan:
    name: Scan for credentials and vulnerable patterns
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # persist-credentials: false because nothing here pushes, and the scanner
      # runs over untrusted PR contents. fetch-depth: 2 so the PR merge commit
      # has its base parent, which is how the report knows what the PR changed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # Downloaded into RUNNER_TEMP (never the checkout, which gets scanned),
      # hash-checked against a pinned integrity, then installed with
      # --ignore-scripts. The download retries; an integrity mismatch does not,
      # because that is not a network blip.
      #
      # To upgrade: `npm view @profullstack/threatcrush@<ver> dist.integrity`
      # and update both lines together.
      - name: Install ThreatCrush
        run: |
          set -euo pipefail
          spec='@profullstack/threatcrush@0.13.78'
          want='sha512-yNkBzEvBWZeRPB0cGiMzaU3ZX/P1TV6OthNYJFTmOSh9Lyl3OexPSXGzXzb6e1Ext+Qvk92sr38RlDAl1DzRTA=='

          name=""
          for attempt in 1 2 3; do
            if name=$(npm pack --silent --pack-destination "${RUNNER_TEMP}" "${spec}" | tail -1) \
              && [ -n "${name}" ] && [ -f "${RUNNER_TEMP}/${name}" ]; then
              break
            fi
            name=""
            echo "::warning::ThreatCrush download attempt ${attempt}/3 failed; retrying"
            sleep $((attempt * 10))
          done
          if [ -z "${name}" ]; then
            echo "::error::ThreatCrush download failed after 3 attempts"
            exit 1
          fi
          tarball="${RUNNER_TEMP}/${name}"

          got="sha512-$(openssl dgst -sha512 -binary "${tarball}" | openssl base64 -A)"
          if [ "${got}" != "${want}" ]; then
            echo "::error::ThreatCrush integrity mismatch for ${spec} (expected ${want}, got ${got}); refusing to install"
            exit 1
          fi

          npm install -g --ignore-scripts "${tarball}"
          threatcrush --version

      - name: Scan
        id: scan
        run: |
          code=0
          args=(scan . --no-upload --format sarif --output threatcrush.sarif)
          if [ -n "$FAIL_ON" ]; then args+=(--fail-on "$FAIL_ON"); fi
          threatcrush "${args[@]}" || code=$?

          # The SARIF file is the evidence a scan happened. No file means the
          # tree was not scanned, which must never read as "no findings".
          if [ ! -s threatcrush.sarif ]; then
            echo "status=error" >> "$GITHUB_OUTPUT"
            echo "::error::ThreatCrush produced no SARIF (exit ${code}); this tree was NOT scanned"
            exit 1
          fi

          case "$code" in
            0) echo "status=clean" >> "$GITHUB_OUTPUT" ;;
            # 1 with a SARIF file = findings at or above FAIL_ON.
            1) echo "status=findings" >> "$GITHUB_OUTPUT"; exit 1 ;;
            *)
              echo "status=error" >> "$GITHUB_OUTPUT"
              echo "::error::ThreatCrush exited ${code}; results may be incomplete"
              exit "$code"
              ;;
          esac

      # Only real results. Code scanning treats each upload as the current
      # truth for its category, so a synthesised empty file would close every
      # open alert.
      - name: Upload to the Security tab
        if: >-
          always()
          && (steps.scan.outputs.status == 'clean' || steps.scan.outputs.status == 'findings')
          && hashFiles('threatcrush.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: threatcrush.sarif
          category: threatcrush

      - name: Build the report
        if: always()
        env:
          SCAN_STATUS: ${{ steps.scan.outputs.status }}
          EVENT: ${{ github.event_name }}
        run: |
          # Files this PR changed: the merge commit against its base parent.
          # Empty on push, or if the parent is missing, and then every finding
          # is listed without the new/pre-existing split.
          if [ "$EVENT" = "pull_request" ]; then
            git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt" 2>/dev/null || : > "$RUNNER_TEMP/changed.txt"
          fi
          python3 << 'PYEOF'
          import json, os

          tmp = os.environ["RUNNER_TEMP"]
          status = os.environ.get("SCAN_STATUS", "")
          try:
              with open(f"{tmp}/changed.txt") as handle:
                  changed = {line.strip() for line in handle if line.strip()}
          except OSError:
              changed = set()

          try:
              with open("threatcrush.sarif") as handle:
                  results = json.load(handle)["runs"][0]["results"]
          except Exception as err:
              results = None
              print(f"::warning::could not read SARIF: {err}")

          LEVEL_TO_SEVERITY = {"error": "high", "warning": "medium", "note": "low"}
          ORDER = ["critical", "high", "medium", "low", "info"]

          def describe(result):
              locations = result.get("locations") or []
              physical = (locations[0] if locations else {}).get("physicalLocation", {})
              uri = physical.get("artifactLocation", {}).get("uri", "")
              line = physical.get("region", {}).get("startLine", 1)
              severity = (result.get("properties") or {}).get("severity") \
                  or LEVEL_TO_SEVERITY.get(result.get("level"), "info")
              severity = severity if severity in ORDER else "info"
              return {"uri": uri, "line": line, "severity": severity,
                      "rule": result.get("ruleId", "?"),
                      "message": result.get("message", {}).get("text", "")}

          def table(findings, limit=50):
              findings = sorted(findings, key=lambda f: (ORDER.index(f["severity"]), f["uri"], f["line"]))
              out = ["| Severity | Rule | Location | Finding |", "|---|---|---|---|"]
              for f in findings[:limit]:
                  where = f"`{f['uri']}`:{f['line']}" if f["uri"] else "(no location)"
                  message = f["message"].replace("|", "\\|")
                  out.append(f"| {f['severity'].upper()} | `{f['rule']}` | {where} | {message} |")
              if len(findings) > limit:
                  out += ["", f"_…and {len(findings) - limit} more. Full results in the SARIF artifact._"]
              return out

          lines = ["## ThreatCrush Security Scan", ""]

          # Fail closed: findings render only on positive evidence the scan
          # finished. A skipped step leaves status empty, which is NOT RUN.
          if status not in ("clean", "findings") or results is None:
              lines += [
                  "**NOT RUN**: the scan did not complete, so this code was not examined.",
                  "This is not a clean result. See the job log.",
              ]
          elif not results:
              lines.append("No findings.")
          else:
              findings = [describe(r) for r in results]
              if changed:
                  new = [f for f in findings if f["uri"] in changed]
                  old = [f for f in findings if f["uri"] not in changed]
                  if new:
                      lines += [f"**{len(new)}** finding(s) in files this PR changes:", ""] + table(new)
                  else:
                      lines.append("No findings in files this PR changes.")
                  if old:
                      lines += ["", "<details>",
                                f"<summary>{len(old)} pre-existing finding(s) in files this PR does not touch</summary>",
                                ""] + table(old) + ["", "</details>"]
              else:
                  lines += [f"**{len(findings)}** finding(s)", ""] + table(findings)
              lines += ["",
                        "False positive? Add `// threatcrush-disable-next-line <rule-id>` above the line, with a reason.",
                        "Snippets are redacted; ThreatCrush never prints matched credential material."]

          with open(f"{tmp}/threatcrush-comment.md", "w") as handle:
              handle.write("\n".join(lines) + "\n")
          PYEOF

      - name: Write report to job summary
        if: always()
        run: cat "$RUNNER_TEMP/threatcrush-comment.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: threatcrush-sarif
          path: threatcrush.sarif
          if-no-files-found: ignore
          retention-days: 30

      # Best-effort and same-repo only: fork PRs get a read-only token. Never
      # switch to pull_request_target for a writable token; that runs with
      # secrets in scope against untrusted contributor code.
      - name: Comment on PR
        if: >-
          always()
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            let body;
            try {
              body = fs.readFileSync(`${process.env.RUNNER_TEMP}/threatcrush-comment.md`, 'utf8');
            } catch {
              body = '## ThreatCrush Security Scan\n\nThe report could not be read. See the job log.';
            }

            try {
              // Paginated: listComments stops at 30, and a missed match means
              // a duplicate report on every run.
              const comments = await github.paginate(github.rest.issues.listComments, {
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              });
              const existing = comments.find(
                (c) => c.user.type === 'Bot' && c.body.includes('ThreatCrush Security Scan'),
              );
              const params = { owner: context.repo.owner, repo: context.repo.repo, body };
              if (existing) {
                await github.rest.issues.updateComment({ ...params, comment_id: existing.id });
              } else {
                await github.rest.issues.createComment({ ...params, issue_number: context.issue.number });
              }
            } catch (err) {
              core.warning(
                `Could not post PR comment (status ${err.status ?? 'unknown'}): ${err.message}. ` +
                  'Findings are in the job summary.',
              );
            }

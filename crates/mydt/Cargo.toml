[package]
name = "mydt"
version = "0.1.0"
edition = "2021"
description = "MyDevTools .mydt encrypted file format — reference implementation and CLI"
license = "AGPL-3.0"
repository = "https://github.com/mydevtools-tech/mydevtools"
readme = "README.md"

[lib]
name = "mydt"
path = "src/lib.rs"

[[bin]]
name = "mydt"
path = "src/main.rs"
required-features = ["cli"]

[features]
cli = ["dep:rpassword"]

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.11"
zeroize = "1"
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rpassword = { version = "7", optional = true }

[profile.release]
strip = true
lto = true
